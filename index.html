<!doctype html> <html lang="ja"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>GPTテスト</title> </head> <body> <h2>GPT API テスト</h2> <textarea id="txt" style="width:100%;height:100px;">中小企業向けにやさしい一言アドバイスください</textarea>

<br><br>

<button id="btn">送信</button>

<pre id="out" style="white-space:pre-wrap;"></pre> <script> document.getElementById("btn").addEventListener("click", async () => { document.getElementById("out").innerText = "送信中…"; const res = await fetch("/.netlify/functions/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: document.getElementById("txt").value }) }); const data = await res.json(); document.getElementById("out").innerText = data.text || JSON.stringify(data); }); </script> </body> </html>
